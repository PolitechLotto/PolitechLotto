[tox]
envlist = format, lint, mypy, ut
skipdist = True
requires = 
    tox>=4
    tox-uv==1.25.0
    uv==0.6.9

[testenv]
basepython = python3.14
deps =
    -r requirements-test.txt

[testenv:ut]
commands = 
    coverage erase
    coverage run -m pytest {posargs}
    coverage report

[testenv:format-fix]
commands =
    python -m ruff format

[testenv:format]
commands =
    {[testenv:format-fix]commands} --diff

[testenv:lint]
commands =
    python -m ruff check

[testenv:lint-fix]
commands =
    {[testenv:lint]commands} --fix

[testenv:mypy]
commands = mypy {posargs}

